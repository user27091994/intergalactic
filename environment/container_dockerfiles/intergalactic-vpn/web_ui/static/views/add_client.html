<div class="add-client-container">
  <h2>Add Client</h2>
  <form name="addClientForm" ng-submit="addClient()" novalidate>
    <label for="clientName">Client Name:</label>
    <input type="text"
           id="clientName"
           ng-model="clientName"

           ng-pattern="/^[A-Za-z0-9_-]+$/">

    <!-- Display error when the field is touched or the form is submitted and the pattern is invalid -->
    <div class="error" style="color: red;"
         ng-if="addClientForm.$invalid">
      Only alphanumeric characters are allowed.
    </div>

    <button type="submit" ng-disabled="addClientForm.$invalid">Add</button>
  </form>
  <div class="error" ng-if="error" style="color: red;">{{ error }}</div>
  <div class="message" ng-if="message" style="color: green;">{{ message }}</div>
</div>
