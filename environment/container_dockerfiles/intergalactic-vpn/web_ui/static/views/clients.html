<div class="clients-container">
  <h2>Connected Clients</h2>
  <div class="controls">
<!--    <label for="refreshPeriodClients">Refresh Period (ms):</label>-->
<!--    <input type="number" id="refreshPeriodClients" ng-model="refreshPeriod" ng-change="updateRefreshPeriod()" min="1000">-->
    <button ng-click="refresh()">Refresh</button>
  </div>

  <div ng-if="error" class="error">{{ error }}</div>

  <div ng-if="!error && clients.length">
    <div ng-repeat="client in clients" class="client-card">
<!--      <h3>Client {{$index + 1}}</h3>-->
      <table>
        <tbody>
          <tr ng-repeat="(key, value) in client">
            <td>{{ key }}</td>
            <td>{{ value }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div ng-if="!error && !clients.length">
    <p>No connected clients.</p>
  </div>
</div>
